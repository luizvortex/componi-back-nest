# Local dev dependencies. Supabase Postgres + Supabase Auth are hosted,
# so only Redis runs locally (rate limit, cache, BullMQ queues).
#
#   docker compose up -d
#   npm run start:dev
#
# To wipe Redis state between runs:
#   docker compose down -v
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
