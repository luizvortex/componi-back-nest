# Exclude non-production files from duplication and coverage analysis.
# - docs/: documentation and generated type copies, not production code
# - src/database/migrations/: auto-generated SQL migrations; repetitive DDL
#   is intentional and should not count as code duplication
sonar.exclusions=docs/**,src/database/migrations/**
sonar.cpd.exclusions=docs/**,src/database/migrations/**
